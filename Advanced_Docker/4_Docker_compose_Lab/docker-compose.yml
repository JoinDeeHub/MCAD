# remove 'version' (optional in current Compose spec)
services:
  web:
    image: python:3.11
    container_name: flask_web
    working_dir: /app
    volumes:
      - .:/app                # host ./app mapped to absolute container path /app
    command: bash -c "pip install -r requirements.txt && python app.py"
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: redis_db